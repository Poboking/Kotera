# mod-save.yaml — mod 扩展存档 `.rt2` 侧车容器 ABI（MODDX4-D1，2026-11-19 落 specs 权威面）
#
# 状态：从代码逐字段实测反推（真源纪律：每字段带代码「相对 eratw-android/ 的路径:行号」锚；
#   代码与散文冲突以代码为准——与 era-arch-v61u.md §8 的出入清单见 MODDX4-D1 交付报告）。
# 上位叙事（只做导航，不是权威）：era-arch-v61u.md §8（`saveNN.sav` + `.rt2` 一个逻辑存档单元、
#   兼容性矩阵、持久化域矩阵）。本文件落定后，`.rt2` 容器字节布局以本文件为唯一权威；
#   era-arch §8:256 的 ABI-6 v1 段清单是历史叙述（缺 v2 两段，见 compat_and_authority 节）。
#
# 代码真源（全部只读实测）：
#   容器编解码     = core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt
#   抓取/恢复编排  = core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt
#   磁盘配对/命名  = core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt
#   分片生产/恢复  = app/src/main/kotlin/com/eratw/port/android/ModRuntimeAssembly.kt（ModSidecarStoragePort）
#   分段载荷格式   = core-vm/src/main/kotlin/com/eratw/port/core/mod/ModStorageSection.kt（MST1）
#   CSV 注入包装   = core-vm/src/main/kotlin/com/eratw/port/core/save/ModCsvValueCodec.kt（R2PK）
#
# 术语：
#   本体   = saveNN.sav / global.sav（PC Emuera 兼容的原版变量存档，规约 = specs/save-format.md）
#   侧车   = 本体文件名后接 `.rt2` 的伴生容器（本文件的对象）；本体在而侧车缺/坏 = fail-closed 警告
#   分片   = 容器里按 packageId 一包一片的 PackageChunk；容器层不解释载荷
#   孤儿片 = 未激活（禁用/未装）包的分片；解码后原样保留、存盘原样回写
#
# 回归锚：core-vm/src/test/kotlin/com/eratw/port/core/save/SidecarSaveBundleTest.kt（10 用例）
#   与本文件「byte_layout / capacity / decode_discipline」三节逐条对应。
#   entity-ref 声明与跨设备重映射 = EntityRefSaveProtocolTest.kt（10 用例）。

schema: 1

# ---------------------------------------------------------------------------
# 一、文件命名与配对（磁盘面）
# ---------------------------------------------------------------------------
files:
  slot_unit:
    form: 'saveNN.sav + saveNN.sav.rt2 = 一个逻辑存档单元'
    sidecar_naming: '本体路径原样拼接 `.rt2` 后缀（同目录同名，后缀区分）'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt:385-386
    unit_evidence: core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:12
  global_unit:
    form: 'global.sav + global.sav.rt2（跨槽共享，与 global.sav 配对）'
    note: >-
      era-arch 散文与部分 KDoc 写逻辑名「global.rt2」；磁盘真名是 `global.sav.rt2`
      （sidecarPathOf 对 globalPath 的产物），journal = `global.sav.journal`。
    global_path_source: core-vm/src/main/kotlin/com/eratw/port/core/save/SaveConfig.kt:55
    journal_evidence: core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt:822-831
  journal:
    form: 'saveNN.sav.journal / global.sav.journal（配对事务日志，与本体伴生）'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt:388
  transaction_members:
    form: '配对事务成员 = 本体 + 侧车两件（.part / .bak / 定序替换 / COMMITTED 全套照 SaveTransaction）'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt:476-498
  delete_pairing:
    form: '删除相位配对删两成员；清序 journal → 两成员残件 → .rt2 收尾'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt:792-797
  global_bin:
    form: '全局包短 ID 注册表另有单文件落点 rt2_pkg_registry.bin（gameRoot 根，运行期生成物）'
    name_source: app/src/main/kotlin/com/eratw/port/android/ModRuntimeAssembly.kt:288
    location_source: app/src/main/kotlin/com/eratw/port/android/ModRuntimeAssembly.kt:2264-2265
    write_timing: 'mod.shutdown 原子写（app/src/main/kotlin/com/eratw/port/android/ModRuntimeAssembly.kt:1938-1941、:2227）'
    dual_persistence: '双落点 = 全局 bin + 每份 .rt2 的注册表快照段（core-vm/src/main/kotlin/com/eratw/port/core/entity/PackageShortIdRegistry.kt:18）'

# ---------------------------------------------------------------------------
# 二、字节布局（大端；java.io.DataOutputStream 序；段序写死）
# ---------------------------------------------------------------------------
byte_layout:
  order_note: '表内 order 即字节序；encode 侧锚 = SidecarSaveBundle.encode，decode 侧逐项对称'
  encode_entry: core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:123-174
  fields:
    - { order: 1,  name: magic,           type: i32,      value: '0x45525432（ASCII "ERT2"）', source: 'SidecarSaveBundle.kt:197（写 :149 / 读 :240）' }
    - { order: 2,  name: version,         type: u16,      value: '2 或 3；声明段为空写 2，非空写 3；v1 直接拒载', source: 'SidecarSaveBundle.kt:160、:220-223、:265-268' }
    - { order: 3,  name: binding.uniqueCode,    type: i64, value: '绑定三元组第 1 位', source: 'SidecarSaveBundle.kt:151、:66-70（生产值见 binding 节）' }
    - { order: 4,  name: binding.scriptVersion, type: i64, value: '绑定三元组第 2 位', source: 'SidecarSaveBundle.kt:152' }
    - { order: 5,  name: binding.saveTextHash,  type: i32, value: '绑定三元组第 3 位（生产语义 = 本体容器全字节 CRC32，见 binding 节）', source: 'SidecarSaveBundle.kt:153' }
    - { order: 6,  name: registry_snapshot,     type: 'i32 长度 + bytes', value: 'PackageShortIdRegistry.encode 原样字节（容器层不解释）', source: 'SidecarSaveBundle.kt:154-155、:23 KDoc；encode 入口 PackageShortIdRegistry.kt:100' }
    - { order: 7,  name: virtual_no_snapshot,   type: 'i32 长度 + bytes', value: 'VirtualCharaNoRegistry.encode 原样字节；global 侧车恒空段', source: 'SidecarSaveBundle.kt:156-157、:24 KDoc；encode 入口 VirtualCharaNoRegistry.kt:127' }
    - { order: 8,  name: entity_graph_payload,  type: 'i32 长度 + bytes', value: 'EntityPayloadCodec 输出（容器层不解释）；global 侧车恒空', source: 'SidecarSaveBundle.kt:158-159；global 恒空 = SaveService.kt:112' }
    - { order: 9,  name: chunk_count,     type: i32,      value: '分片数（上限 4096）', source: 'SidecarSaveBundle.kt:160、:217' }
    - { order: 10, name: chunks,          type: '逐片：i32 名长 + UTF-8 packageId + i32 载荷长 + bytes', value: '按 Package 一包一片；载荷分层见 chunk_payload 节', source: 'SidecarSaveBundle.kt:177-185；空片名拒载 :266' }
    - { order: 11, name: entity_ref_declaration_segment, type: 'i32 长度 + bytes', value: '仅 v3 固定存在；EntityRefDeclarationCodec VERSION 1 原样字节', source: 'SidecarSaveBundle.kt:113-114、:156-160、:178-182、:295-302；EntityRefDeclarationCodec.kt:15-39' }
    - { order: 12, name: decision_state_segment, type: 'i32 长度 + bytes', value: 'v2 增补尾段 1（决策态）；与 13 同进退', source: 'SidecarSaveBundle.kt:161-162、:183-186、:208-214' }
    - { order: 13, name: job_state_segment,      type: 'i32 长度 + bytes', value: 'v2 增补尾段 2（任务态）；与 12 同进退', source: 'SidecarSaveBundle.kt:161-162、:183-186、:208-214' }
    - { order: 14, name: crc32,           type: i32,      value: '对 order 1..13 实际写出的全部字节的 CRC32，尾部；不含自身', source: 'SidecarSaveBundle.kt:187-194、:257-261' }
  declaration_segment:
    codec_magic: 'i32 0x45524633（ASCII "ERF3"）'
    codec_layout: 'i32 magic + u16 version=1 + i32 count + 有序条目（i32 packageId UTF-8 长度 + bytes + i32 canonical key UTF-8 长度 + bytes + u8 scope）'
    ordering: 'packageId、canonical key、scope.ordinal 字典序严格升序；重复或乱序拒载'
    scope_values: 'NORMAL=0、GLOBAL=1、CHARA=2；scope 由 EntityRefScope.entries 解码'
    limits: '容器段 8 MiB；条目 2^20；packageId 非空且 UTF-8 ≤1024 字节；canonical key 非空、全大写、无首尾空白且 UTF-8 ≤512 字节'
    empty_rule: '空声明不写该段并保持 v2；v3 解码固定要求该段存在且严格自校验'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/EntityRefDeclarationCodec.kt:15-85
  state_segments_gate:
    rule: '尾段 12/13 要么都写、要么都不写：两段全空 = 增补前逐字节同形（不写任何尾段字节）'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:161-162、:183-186
    empty_carrier: core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:80-91
    payload_codecs: '决策态 = DecisionStateCodec VERSION 2 输出、任务态 = JobSchedulerStateCodec VERSION 2 输出；容器层不解释内容'
    codec_evidence: 'core-vm/src/main/kotlin/com/eratw/port/core/mod/DecisionStateCodec.kt:22、core-vm/src/main/kotlin/com/eratw/port/core/mod/JobSchedulerStateCodec.kt:17-21、:50'
  min_size:
    value_by_version:
      v2: 46
      v3: 60
    formula_v3: 'v2 的 46 字节 + 声明段长度字 4 + 空声明 codec 头 10；v3 非空条目另增'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:246-247、:295-302
    note: 'decode 先执行 46 字节总长闸，再由 v3 固定 readBlob 与 declaration codec 拒绝截断；不存在合法的 56 字节 v3 最小容器'

# ---------------------------------------------------------------------------
# 三、绑定三元组（.rt2 与 .sav 的同一性凭据）
# ---------------------------------------------------------------------------
binding:
  fields:
    - name: uniqueCode
      production_value: 'GameBase.csv `コード`（gameCode）＝ .sav 头部的 UniqueCode 同源值'
      source: 'core-vm/src/main/kotlin/com/eratw/port/core/data/csv/GameBaseLoader.kt:39/:60；写入点 core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt:468-472'
    - name: scriptVersion
      production_value: 'GameBase.csv `バージョン`（version）'
      source: core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt:468-472
    - name: saveTextHash
      production_value: '本体 .sav 容器全字节 CRC32（存/读两侧都从同一份文件字节现算，不依赖文本回读）'
      ruling: >-
        era-arch §8:221 的字面命名 saveTextHash 从未定义哈希对象；生产裁定 = CRC32-of-bytes
        是文本哈希的严格加强而非等价替换（按绑定目的「PC 往返检测配对漂移」）；威胁模型 =
        意外漂移，非对抗性伪造。global 侧第三位 = global.sav 容器字节 CRC32（构法照抄槽档）。
      ruling_source: core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt:390-413
      global_source: 'core-vm/src/main/kotlin/com/eratw/port/core/save/GlobalSidecarSaveWiring.kt:39-48；FileSystemOps.kt:891/:974'
      naming_source: core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:57-64
  check_order:
    rule: '绑定校验先于任何写入：三元组全等（matchesBinding）才允许应用侧车；不符返回 BindingMismatch（宿主上三语警告），不是异常'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:120
    order_source: 'core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:132-135（槽档）、:180-183（global）'
    outcome_type: core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:62-69

# ---------------------------------------------------------------------------
# 四、容量闸（encode 前置 require；decode 同值越界拒载）
# ---------------------------------------------------------------------------
capacity:
  source: core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:124-144（写）、:245-258（读）
  limits:
    - { field: entity_graph_payload,    max: '64 MiB',  const: MAX_GRAPH_BYTES,          line: 202 }
    - { field: registry_snapshot,       max: '8 MiB',   const: MAX_REGISTRY_BYTES,       line: 205 }
    - { field: virtual_no_snapshot,     max: '16 MiB',  const: MAX_VIRTUAL_NO_BYTES,     line: 208 }
    - { field: decision_state_segment,  max: '16 MiB',  const: MAX_DECISION_STATE_BYTES, line: 211 }
    - { field: job_state_segment,       max: '16 MiB',  const: MAX_JOB_STATE_BYTES,      line: 238 }
    - { field: entity_ref_declaration_segment, max: '8 MiB', const: 'EntityRefDeclarationCodec.MAX_BYTES', line: 19 }
    - { field: chunk_count,             max: 4096,      const: MAX_CHUNKS,               line: 241 }
    - { field: '每片载荷 payload',       max: '32 MiB',  const: MAX_CHUNK_BYTES,          line: 220 }
  note: '决策/任务态段在 codec 内另有各自条目数闸（2 的 20 次幂条），不在容器层（SidecarSaveBundle.kt:210/:213 KDoc）'

# ---------------------------------------------------------------------------
# 五、解码纪律（fail-closed；任何一条不过 = SidecarFormatException）
# ---------------------------------------------------------------------------
decode_discipline:
  exception: '容器损坏 / 版本不符 / 容量越界 / CRC 失败抛 SidecarFormatException（文案由宿主侧包三语存档错误）'
  exception_source: core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:55
  position_note: >-
    容器级损坏前置拦截，不进「先复位后解析」的官方 .sav 变量层语义路径（那条是 specs/save-format.md
    §5.3 与 ADR-005 的辖区）。
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:225-229
  rules:
    - { id: D1, rule: '总长度 < 46 拒',                       source: 'SidecarSaveBundle.kt:232' }
    - { id: D2, rule: 'CRC32 先于任何字段解析（对除尾 4 字节外全部字节）', source: 'SidecarSaveBundle.kt:233-237' }
    - { id: D3, rule: 'magic 不符拒',                          source: 'SidecarSaveBundle.kt:240' }
    - { id: D4, rule: 'version 只认 2/3；v1 与其他版本直接拒载；v3 必须含固定声明段', source: 'SidecarSaveBundle.kt:265-268、:295-302' }
    - { id: D5, rule: '各 blob 段：长度 <0 / 超容量闸 / 超剩余字节 = 拒', source: 'SidecarSaveBundle.kt:245-252' }
    - { id: D6, rule: '分片数 <0 或 >4096 拒；片名长 <=0 或超剩余拒；空片名拒', source: 'SidecarSaveBundle.kt:257-266' }
    - { id: D7, rule: 'v3 分片后固定读声明段并严格解码；v2 分片后有剩余字节才读 12/13 尾段；有剩余但读不满两段或读完后仍有剩余 = 拒', source: 'SidecarSaveBundle.kt:295-311' }
    - { id: D8, rule: '旧档无 12/13 尾段 = 两段取空缺省回落，不拒载：决策态回落「未初始化 seed（宿主熵派生）+ 无动态实例」、任务态回落「无实例」', source: 'SidecarSaveBundle.kt:35-44、:87-91' }
    - { id: D9, rule: 'v3 声明段 CRC 失败、截断、重复/乱序、非法 UTF-8、scope/容量越界或尾随字节均拒载', source: 'EntityRefDeclarationCodec.kt:47-85、:101-132；SidecarSaveBundle.kt:257-261' }

# ---------------------------------------------------------------------------
# 六、分片载荷分层（容器层不解释；真实分层自外向内）
# ---------------------------------------------------------------------------
chunk_payload:
  layering: 'PackageChunk.payload 按包可能为「裸 MST1」或「R2PK 包装（MST1 + CSV 值段）」两层'
  r2pk:
    magic: 'i32 0x5232504B（ASCII "R2PK"）'
    version: 'u16 = 1'
    fields: 'i32 长度 + MST1 存储字节 → i32 长度 + CSV 值段'
    empty_rule: 'CSV 值段为空时不包装，载荷 = 裸 MST1 字节（旧档、纯 Base 档、未装注入位计划的会话零字节变化）；decode 见前四字节不是 "R2PK" 就当旧裸 MST1（csv 空）'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/ModCsvValueCodec.kt:21-51、:83-85
  mst1:
    summary: 'Mod 存储分段容器（一包一段的编码产物；写侧排序保证确定性）'
    magic: 'i32 0x4D535431（ASCII "MST1"）'
    version: 'u16 = 2（写出恒 v2；v1 只读：段缺 dataVersion 补 0）'
    body: >-
      i32 段数；每段 = u16 名长 + UTF-8 packageId + i32 条目数 + 逐条目（u16 键长 + UTF-8 键 +
      u8 值类型：0=ABSENT 墓碑 / 1=i64 / 2=u16 长度+UTF-8 串）+ v2 段尾 i32 dataVersion（非负）
    order_rule: 'packageId 与键按 UTF-8 字节序严格升序；乱序 / 重复 = 拒（拒绝非规范输入使孤儿段再编码逐字节不变）'
    trailing_rule: '段表后剩余字节 = 拒'
    source: core-vm/src/main/kotlin/com/eratw/port/core/mod/ModStorageSection.kt:52-167（序律 :191-196）
  csv_values:
    rule: 'Mod CSV 注入值只进激活包自己的分片；孤儿片载荷绝不被本会话值污染（原样透传）'
    restore_ownership: >-
      恢复前必须以当前 ModCsvInjectionPlan.cellAt 核对 packageId、表、关键字与索引完全归属该存档键，
      且 isInjected 为真；失主、Base、alias 或当前关键字已消失的格子只告警丢弃，不得写变量池。
    ownership_source: core-vm/src/main/kotlin/com/eratw/port/core/vars/ModCsvValues.kt:405-431
    source: 'app/src/main/kotlin/com/eratw/port/android/ModRuntimeAssembly.kt:2016-2023；并集面 ModCsvValueCodec.kt:63-76'
    spec_crossref: '持久化键 (PackageId, TableId, CanonicalKeyword, CharIdentity, Value) 与「Base 位进 .sav、Mod 位进 .rt2」语义 = era-arch-v61u.md §8:246-252'

# ---------------------------------------------------------------------------
# 七、分片分组 / 孤儿 / 生命周期（抓取与恢复的真实语义）
# ---------------------------------------------------------------------------
lifecycle:
  chunk_groups:
    form: '抓取分两组：activeChunks（本次激活包重抓）+ orphanChunks（未激活包透传）；同 packageId 不得既在激活组又在孤儿组，组内也不得重复——违者当场抛'
    source: 'core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:215-231（合并序 = active 先 orphan 后 :230）；类型隔离 core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveWiring.kt:18-21'
  orphan_passthrough:
    rule: '未激活 Mod 的分片解码后原样保留、存盘时原样回写——容器层不解释分片内容，激活与否由宿主判定'
    source: 'core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:46-47；SaveService.kt:33-37'
  disable_not_delete:
    rule: '禁用（deactivate）只把包移出激活集，数据整段留下；读档时不在已知包集合里的段整段保留为非激活段，再编码逐字节不变（codec 孤儿口径）'
    source: 'core-vm/src/main/kotlin/com/eratw/port/core/mod/ModStorageStore.kt:16-19、:71-74、:187-195'
  release:
    rule: '显式卸载（release）= 整包遗忘：段 + dataVersion 记录 + 激活标记一起摘；抓取侧对已释放包整段跳过（段与字节减在下次存档，历史档不改写）'
    source: 'core-vm/src/main/kotlin/com/eratw/port/core/mod/ModStorageStore.kt:272-278；app/src/main/kotlin/com/eratw/port/android/ModRuntimeAssembly.kt:1991-2027'
  restore_order:
    rule: '先完成绑定、声明、导入计划、重映射实体快照、虚拟 NO 与变量槽的全量预检；commit 才按变量槽 → 宿主复位回调 → 投影身份复位 → 实体图替换 → 虚拟 NO → 注册表提交'
    source: 'core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:166-232'
  same_session_replace:
    rule: '同会话 LOADDATA 允许现内核非空：prepare 仍零写，commit 在投影复位后以 replaceRestore 替换实体、列、边与槽代际；旧槽实体不得残留'
    source: core-vm/src/main/kotlin/com/eratw/port/core/entity/EntityKernel.kt:516-539
  restore_rebuild:
    rule: '宿主侧重建容器：解码各片 → R2PK 拆包 → MST1 decode(bytes, 已知包=本会话激活集) → 合并重编 → ModStorageStore.load → adoptStorage'
    source: app/src/main/kotlin/com/eratw/port/android/ModRuntimeAssembly.kt:2061-2075

# ---------------------------------------------------------------------------
# 七·五、entity-ref 三遍历面与显式跨设备重映射（ABI-2）
# ---------------------------------------------------------------------------
entity_ref_remapping:
  status: '本引擎扩展 ABI；PC Emuera 无直接对应物，权威 = 本规约 + 下列实现锚'
  csharp_anchor: 'TODO(verify)：不存在可锚定的 PC C# 跨设备重映射语义；不得用同形 EntityId 行为冒充移植依据'
  persistent_surfaces:
    - id: 1
      form: '实体组件中标为 EntityRef 的整数字段'
      implementation: 'EntityIdImportPlan.remapped 对完整实体快照统一重映射；restore 同时核对字段类型与 entity-ref 旗标，旗标漂移零写拒绝'
      source: 'core-vm/src/main/kotlin/com/eratw/port/core/entity/EntityIdImportPlan.kt:19-31；EntityKernel.kt:573-590'
    - id: 2
      form: '关系两端 EntityId'
      implementation: '与组件同一 EntitySnapshot.remapped；重映射前后验证活 EntityId 单射'
      source: core-vm/src/main/kotlin/com/eratw/port/core/entity/EntityIdImportPlan.kt:19-47
    - id: 3
      form: 'Manifest 显式声明的 INT SAVEDATA 变量槽与 Mod CSV 注入整数槽；槽档只处理 NORMAL/CHARA，GLOBAL 仅走 LOADGLOBAL'
      implementation: '只遍历冻结声明 ∩ 已注册 ∩ INT ∩ SAVEDATA ∩ 实际发射；私有域永不进入；严格模式无法解析即拒'
      source: 'core-vm/src/main/kotlin/com/eratw/port/core/vars/EntityRefVariablePlanner.kt:70-143；SaveService.kt:199-217；core-vm/src/main/kotlin/com/eratw/port/core/vars/ModCsvValues.kt:405-431'
  slot_global_split:
    rule: '槽档跨设备重映射只改 NORMAL/CHARA 与 CHARA CSV；GLOBAL 不由 saveNN.sav.rt2 恢复，也不得被槽档 remap 污染'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:203-217
  virtual_no_authority:
    rule: '槽档虚拟 NO 段是该槽权威身份集，替换而非并集；非空段连同快照游标恢复，空段清身份但保留本会话续发游标，已发号不退回池'
    source: 'core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:190-198；VirtualCharaNoRegistry.kt:196-206'
  declaration_lifetime:
    rule: '激活包使用当前冻结声明；未激活包沿用存档携带声明；后续存档继承孤儿声明；重激活声明与旧声明不一致 = 写入前拒绝'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:231、:367-402
  same_device:
    rule: '默认严格并集：同包异 ID 或同 ID 异包当场拒绝；不静默择一、不自动重分配'
    source: core-vm/src/main/kotlin/com/eratw/port/core/entity/EntityIdImportPlan.kt:51-80
  cross_device:
    entry: 'FileSystemOps.loadDataCrossDevice；SidecarStoragePort 未实现 CrossDeviceSidecarStoragePort 时拒绝进入'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt:700-708、:551-559
    allocation: >-
      读取源注册表快照后，保留 __core__=1；其余源包按 packageId 字典序，从目标 nextId
      水位依次单调分配。相同目标视图与相同源字节产生相同计划；容量耗尽拒绝。恒等分配不写入
      remapTable，不能伪装成实际重映射。
    allocation_source: core-vm/src/main/kotlin/com/eratw/port/core/entity/EntityIdImportPlan.kt:83-101
    commit_order: >-
      .sav 先按原版语义完整落地且字节不改；随后侧车解码、分片/决策/任务/CSV 载荷全部预检；
      非空可挂起剧情续体先与实体图共用同一 remapTable 重映射 actor/targets/primaryTarget，
      commit 依次提交第三面变量槽、宿主复位回调、投影身份复位、实体图替换、虚拟 NO、注册表，
      再 adopt 已重映射分片与决策/任务态，最后提交 CSV；任一步校验失败不得进入半恢复提交序列。
    commit_source: 'core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt:733-776；core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:165-246；app/src/main/kotlin/com/eratw/port/android/ModRuntimeAssembly.kt:2302-2369'
    old_save_rule: 'v2 无声明档在同设备模式可读；跨设备产生非空 remapTable 时无声明即拒，禁止猜测变量槽语义'
    old_save_source: core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:178-187
    global_rule: 'LOADGLOBAL 只恢复 GLOBAL 声明槽与分片，使用恒等表，不执行跨设备短 ID 重分配；跨设备入口仅覆盖槽档'
    global_source: core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:294-339
  host_scope: '生产端口已支持显式跨设备恢复；导入界面与用户触发动作尚未接线，不得宣称存在完整跨设备导入 UX'
  durable_context_surface:
    rule: >-
      槽档剧情续体保存完整 InteractionContext；跨设备恢复与实体图共用同一 EntityIdRemapTable，
      只重映射 actor、targets、primaryTarget。空字符串是“无续体”的恒等哨兵，不得解码或改写；
      仅存在非空续体被重映射时才重建存储容器。
    empty_identity_rule: '空续体与恒等 remapTable 均原样保留；保留键非字符串或非空续体损坏时，在恢复与跨设备重映射路径失败关闭，实体、注册表与存储不得提交'
    csharp_anchor: 'TODO(verify)：可挂起剧情续体及跨设备引用重映射是 RT2 自研 ABI，PC reference 无对应语义'
    source: 'core-vm/src/main/kotlin/com/eratw/port/core/mod/DurableInteractionRuntime.kt:142-164；DurableInteractionWiring.kt:14-53；app/src/main/kotlin/com/eratw/port/android/ModRuntimeAssembly.kt:2338-2369'
  evidence: core-vm/src/test/kotlin/com/eratw/port/core/save/EntityRefSaveProtocolTest.kt；core-vm/src/test/kotlin/com/eratw/port/core/mod/DurableInteractionRuntimeTest.kt；app/src/test/kotlin/com/eratw/port/android/ModSaveStateIntegrityE2ETest.kt

# ---------------------------------------------------------------------------
# 八、槽档 vs global 侧车的形态差（同一容器 ABI，两个抓取/恢复入口）
# ---------------------------------------------------------------------------
slot_vs_global:
  slot:
    capture: 'captureBundle：注册表快照 + 实体图 + 虚拟 NO 段 + 分片（SaveService.kt:89-99）'
    restore: 'prepareSlotRestore：绑定/形态/声明/导入计划/实体图/虚拟 NO/变量槽预检 → Ready.commit（SaveService.kt:165-233）'
  global:
    capture: 'captureGlobalBundle：实体图恒空、虚拟 NO 恒空，只带注册表快照与 Mod GLOBAL 分片；写触发 = SAVEGLOBAL（SaveService.kt:102-116）'
    restore: >-
      restoreGlobalBundle：只验绑定与 global 形状闸（实体图非空 = 槽档误喂，拒；虚拟 NO 非空 = 槽档误喂，拒），
      恢复 GLOBAL 声明引用槽（恒等 remap）并把分片原样交还宿主——不并注册表、不灌内核、不替换虚拟 NO。
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:296-339
    zero_payload_identity: '空内核经 EntityPayloadCodec.encode 也写版本头与名表（≥8 字节），故「零长实体载荷」唯一地标识 global 形（SaveService.kt:121-125）'
  state_segments:
    rule: '决策/任务态尾段在槽档与 global 两侧同口径同结构（不为任一侧另开段格式）；宿主缝未装配 = 两段都不写（旧档同形）'
    source: app/src/main/kotlin/com/eratw/port/android/ModRuntimeAssembly.kt:2031-2059、:2118-2148
  production_note: >-
    SaveService.captureBundle 自身不带尾段（stateSegments 缺省 EMPTY）；生产槽档字节经
    ModSidecarStoragePort.captureRt2Bytes 重组容器再 encode，把 stateSegmentsForSave() 的
    缝快照接上（缝缺席 = 旧档同形）。
    source: app/src/main/kotlin/com/eratw/port/android/ModRuntimeAssembly.kt:2031-2048

