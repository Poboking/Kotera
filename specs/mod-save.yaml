compat_and_authority:
  sav_purity:
    rule: '.sav 文件结构保持 PC Emuera 兼容；实体数据严禁寄生 .sav 的 emData/MapValue'
    source: core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:49-51
  honest_wording:
    rule: >-
      .sav 本体可被 PC Emuera 读写；随行的 .rt2 扩展数据 PC 不识别——完整扩展存档不保证 PC
      可继续游戏。PC 玩过同一槽再传回安卓 = 检测 .rt2 绑定失配/缺失 → 上警告（扩展状态可能
      滞后或丢失），不是静默应用；不存在「100% 互通」。
    anchors: >-
      core-vm/src/main/kotlin/com/eratw/port/core/save/SidecarSaveBundle.kt:49-51；
      core-vm/src/main/kotlin/com/eratw/port/core/save/SaveService.kt:28-30；
      core-vm/src/main/kotlin/com/eratw/port/core/save/FileSystemOps.kt:514-552；
      era-arch-v61u.md:223-231（兼容性矩阵）
  authority:
    rule: '本文件落定（2026-11-19）后，.rt2 容器字节布局/段序/容量/拒载纪律的权威 = 本文件；era-arch-v61u.md §8:256 的 ABI-6 v1 段清单保留作历史叙述（缺 v2 虚拟 NO 段与决策/任务态尾段）'
  inner_codecs_todo:
    - >-
      TODO(verify)：PackageShortIdRegistry.encode（PackageShortIdRegistry.kt:100）与
      VirtualCharaNoRegistry.encode（VirtualCharaNoRegistry.kt:127）、EntityPayloadCodec 的
      内层字节格式未在本文件逐字段冻结（容器层不解释）；需要时另立扩段，卡点 = 本波只冻结
      容器 ABI 面，内层 codec 规约无既有 specs 落点。

